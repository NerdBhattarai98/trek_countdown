<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>400 Days to the Trek</title>
<meta name="description" content="Counting down 400 days to our trek.">
<meta name="theme-color" content="#0e1112">
<meta property="og:title" content="400 Days to the Trek">
<meta property="og:description" content="Counting down 400 days to our trek.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%230e1112'/><path d='M6 50 L24 22 L33 36 L41 26 L58 50Z' fill='%235b8c66'/><path d='M24 22 L19 30 L24 28 L28 31Z' fill='%23ebe7de'/><circle cx='47' cy='16' r='5' fill='%23e98a3c'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e1112; --line2:rgba(255,255,255,.13);
  --text:#ebe7de; --muted:#98a198; --dim:#6b756e;
  --forest:#2f4a37; --green:#5b8c66; --orange:#e98a3c; --orange2:#f4a862;
  --head:'Barlow Condensed',ui-sans-serif,system-ui,sans-serif;
  --body:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.hero{position:relative;overflow:hidden;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px 150px;isolation:isolate}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.mist{position:absolute;left:-30%;width:160%;height:140px;z-index:-1;background:radial-gradient(ellipse at center,rgba(210,215,205,.07),transparent 70%);filter:blur(8px);animation:drift 46s ease-in-out infinite alternate;pointer-events:none}
.mist.m1{bottom:22%}.mist.m2{bottom:10%;animation-duration:62s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translateX(-6%)}to{transform:translateX(6%)}}
.inner{max-width:1000px;width:100%;text-align:center;animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.eyebrow{font-size:.72rem;letter-spacing:.38em;text-transform:uppercase;color:var(--orange2)}
h1{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(2.6rem,7.4vw,5.6rem);line-height:.92;margin:14px 0 12px}
h1 em{font-style:normal;color:var(--orange)}
.sub{color:var(--muted);font-size:.95rem}
.sub b{color:var(--text);font-weight:500}
.countdown{display:flex;justify-content:center;gap:clamp(8px,2vw,18px);margin:36px 0 24px}
.unit{min-width:clamp(72px,16vw,160px);padding:22px 8px 14px;border-radius:18px;background:rgba(18,24,25,.55);border:1px solid var(--line2);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.num{font-family:var(--head);font-weight:600;font-size:clamp(2.4rem,7.5vw,5.2rem);line-height:1;font-variant-numeric:tabular-nums}
.lbl{font-size:.66rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.status{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 24px;color:var(--muted);font-size:.92rem}
.status b{color:var(--text);font-weight:600}
.track{position:relative;margin:30px auto 0;max-width:820px;padding:0 10px 34px}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--forest),var(--green),var(--orange));transition:width 1s ease}
.ms-wrap{position:absolute;left:10px;right:10px;top:0}
.ms{position:absolute;top:-6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
.ms i{display:block;width:20px;height:20px;border-radius:50%;background:#13181a;border:2px solid var(--line2);transition:.4s}
.ms span{font-size:.66rem;color:var(--dim);margin-top:6px;white-space:nowrap}
.ms.done i{background:var(--orange);border-color:var(--orange2);box-shadow:0 0 12px rgba(233,138,60,.55)}
.ms.done span{color:var(--orange2)}
.ms.next i{border-color:var(--orange);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(233,138,60,.5)}70%{box-shadow:0 0 0 10px rgba(233,138,60,0)}100%{box-shadow:0 0 0 0 rgba(233,138,60,0)}}
.quote{margin:24px auto 0;max-width:620px;font-style:italic;color:#cfcabe;min-height:3.2em;transition:opacity .6s}
.quote small{display:block;font-style:normal;color:var(--dim);font-size:.72rem;margin-top:4px;letter-spacing:.14em;text-transform:uppercase}
.crew-link{display:inline-block;margin-top:14px;color:var(--orange2);font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid transparent;padding-bottom:2px;transition:.3s}
.crew-link:hover{border-bottom-color:var(--orange2)}
footer.hero-foot{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:var(--dim);font-size:.75rem}
.done-mode h1 em{color:var(--orange2)}

/* ===== Crew ===== */
.crew{position:relative;padding:96px 20px 110px;background:linear-gradient(180deg,#0e1112 0%,#111816 60%,#0e1112 100%);border-top:1px solid var(--line2)}
.crew-inner{max-width:1080px;margin:0 auto}
.crew-head{text-align:center;margin-bottom:48px}
.crew-head h2{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(2.2rem,5.6vw,4rem);line-height:.95;margin:12px 0 12px}
.crew-head h2 em{font-style:normal;color:var(--orange)}
.crew-head p{color:var(--muted);font-size:.95rem}
.crew-head p b{color:var(--text);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.card{position:relative;padding:28px 22px 24px;border-radius:20px;background:rgba(18,24,25,.6);border:1px solid var(--line2);text-align:center;transition:transform .3s,border-color .3s,box-shadow .3s;opacity:0;transform:translateY(16px);animation:rise .7s ease forwards}
.card:hover{transform:translateY(-4px);border-color:rgba(233,138,60,.55);box-shadow:0 14px 34px rgba(0,0,0,.35)}
.card{overflow:hidden}
.bib{position:absolute;top:-6px;right:10px;font-family:var(--head);font-weight:700;font-size:5.2rem;line-height:1;color:var(--c1);opacity:.09;pointer-events:none;user-select:none}
.tag{display:inline-block;font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.tag b{color:var(--c1);font-weight:600}
.emblem{width:104px;height:84px;margin:0 auto 14px;display:block}
.emblem .sun{fill:var(--c2);opacity:.9}
.emblem .back{fill:var(--c1);opacity:.35}
.emblem .front{fill:var(--c1)}
.emblem .snow{fill:#ebe7de}
.card:hover .emblem .sun{animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.7}to{opacity:1}}
.card h3{font-family:var(--head);font-weight:700;font-size:1.6rem;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
.role{display:inline-block;margin-top:8px;font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--orange2)}
.note{margin-top:12px;color:var(--muted);font-size:.88rem;line-height:1.5}
.crew-foot{text-align:center;margin-top:44px;color:var(--dim);font-size:.82rem}
.crew-foot a{color:var(--orange2);text-decoration:none}
.top{display:inline-block;margin-top:10px}

/* ===== Join form ===== */
.join{max-width:720px;margin:64px auto 0;padding:34px 30px 30px;border-radius:22px;background:rgba(18,24,25,.65);border:1px solid var(--line2);position:relative;overflow:hidden}
.join::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 100% 0%,rgba(233,138,60,.14),transparent 55%);pointer-events:none}
.join h3{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:clamp(1.8rem,4.4vw,2.6rem);line-height:1;text-align:center}
.join h3 em{font-style:normal;color:var(--orange)}
.join .lede{text-align:center;color:var(--muted);font-size:.92rem;margin:10px 0 26px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field.full{grid-column:1/-1}
.field label{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;font:inherit;font-size:.95rem;color:var(--text);background:rgba(8,11,12,.7);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;transition:border-color .25s,box-shadow .25s}
.field textarea{min-height:92px;resize:vertical}
.field select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 14px) 52%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.field select option{background:#12181a;color:var(--text)}
.field input::placeholder,.field textarea::placeholder{color:var(--dim)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(233,138,60,.18)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.btn{grid-column:1/-1;margin-top:6px;font-family:var(--head);font-weight:700;font-size:1.25rem;letter-spacing:.14em;text-transform:uppercase;color:#0e1112;background:linear-gradient(90deg,var(--orange),var(--orange2));border:0;border-radius:14px;padding:15px 20px;cursor:pointer;transition:transform .2s,box-shadow .2s,opacity .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(233,138,60,.3)}
.btn:disabled{opacity:.6;cursor:wait;transform:none}
.form-msg{grid-column:1/-1;text-align:center;font-size:.9rem;min-height:1.3em;color:var(--muted)}
.form-msg.ok{color:var(--green)}
.form-msg.err{color:#e07a5f}
@media (max-width:600px){.join{padding:26px 18px 22px}.fields{grid-template-columns:1fr}}
@media (max-width:600px){
  .unit{padding:14px 4px 10px;border-radius:14px}
  .ms span{font-size:.58rem}
  .ms:nth-child(odd):not(:last-child) span{visibility:hidden}
  .crew{padding:72px 16px 90px}
  .grid{grid-template-columns:1fr 1fr;gap:12px}
  .card{padding:22px 12px 18px}
  .emblem{width:80px;height:65px}
  .bib{font-size:4rem}
  .card h3{font-size:1.3rem}
}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="hero" id="hero">
  <svg class="hero-bg" viewBox="0 0 1440 760" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#090c0e"/><stop offset=".55" stop-color="#121c1c"/><stop offset=".82" stop-color="#2a2a22"/><stop offset="1" stop-color="#3a2a1c"/>
      </linearGradient>
      <radialGradient id="glow" cx=".62" cy=".78" r=".45">
        <stop offset="0" stop-color="#e98a3c" stop-opacity=".38"/><stop offset="1" stop-color="#e98a3c" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="far" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4643"/><stop offset="1" stop-color="#1d2725"/></linearGradient>
      <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22322b"/><stop offset="1" stop-color="#141c19"/></linearGradient>
    </defs>
    <rect width="1440" height="760" fill="url(#sky)"/>
    <rect width="1440" height="760" fill="url(#glow)"/>
    <g id="stars"></g>
    <path fill="url(#far)" d="M0 520 L90 470 L170 490 L260 400 L330 440 L420 330 L500 400 L560 370 L640 300 L700 340 L790 250 L860 320 L930 290 L1010 360 L1090 300 L1170 380 L1250 340 L1340 410 L1440 380 L1440 760 L0 760Z"/>
    <path fill="#d9d4c7" opacity=".55" d="M790 250 L762 286 L778 280 L790 294 L806 278 L822 290Z M640 300 L616 330 L632 325 L644 336 L656 322 L668 328Z M420 330 L398 360 L414 355 L424 364 L436 352Z M1090 300 L1070 326 L1084 322 L1094 330 L1106 318Z"/>
    <path fill="url(#mid)" d="M0 600 L110 520 L210 560 L330 470 L450 560 L540 500 L660 580 L780 470 L900 560 L1010 500 L1120 570 L1230 490 L1340 560 L1440 520 L1440 760 L0 760Z"/>
    <path fill="#111815" d="M0 660 L150 600 L300 650 L470 590 L640 660 L820 600 L1000 660 L1180 610 L1340 650 L1440 620 L1440 760 L0 760Z"/>
    <path fill="#0e1112" d="M0 712 L240 680 L520 712 L800 684 L1100 714 L1440 688 L1440 760 L0 760Z"/>
  </svg>
  <div class="mist m1"></div><div class="mist m2"></div>

  <div class="inner">
    <div class="eyebrow" id="eyebrow">The countdown is on</div>
    <h1><em id="bigDays">400 Days</em> to the Trek</h1>
    <p class="sub" id="sub"></p>

    <div class="countdown" role="timer">
      <div class="unit"><div class="num" id="d">--</div><div class="lbl">Days</div></div>
      <div class="unit"><div class="num" id="h">--</div><div class="lbl">Hours</div></div>
      <div class="unit"><div class="num" id="m">--</div><div class="lbl">Minutes</div></div>
      <div class="unit"><div class="num" id="s">--</div><div class="lbl">Seconds</div></div>
    </div>

    <div class="status" id="status"></div>

    <div class="track">
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="ms-wrap" id="milestones"></div>
    </div>

    <p class="quote" id="quote"></p>
    <a class="crew-link" href="#crew">Meet the crew ↓</a>
  </div>
  <footer class="hero-foot">Counting down in Nepal Time (UTC+05:45) 🥾</footer>
</main>

<section class="crew" id="crew" aria-labelledby="crewTitle">
  <div class="crew-inner">
    <div class="crew-head">
      <div class="eyebrow">Who's coming</div>
      <h2 id="crewTitle">Meet the <em>Crew</em></h2>
      <p id="crewCount"></p>
    </div>
    <div class="grid" id="crewGrid"></div>
    <div class="join" id="join">
      <h3>Want to <em>join</em> the trek?</h3>
      <p class="lede">Fill this in and we'll get back to you. Spots are limited.</p>
      <form class="fields" id="joinForm" novalidate>
        <div class="field">
          <label for="jName">Your name</label>
          <input id="jName" name="name" type="text" placeholder="Full name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="jContact">Email or phone</label>
          <input id="jContact" name="contact" type="text" placeholder="How can we reach you?" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="jExp">Trekking experience</label>
          <select id="jExp" name="experience" required>
            <option value="" disabled selected>Select one</option>
            <option>First trek ever</option>
            <option>Day hikes only</option>
            <option>A few multi-day treks</option>
            <option>Seasoned trekker</option>
          </select>
        </div>
        <div class="field">
          <label for="jFit">Current fitness</label>
          <select id="jFit" name="fitness" required>
            <option value="" disabled selected>Select one</option>
            <option>Just getting started</option>
            <option>Moderately active</option>
            <option>Very fit</option>
          </select>
        </div>
        <div class="field full">
          <label for="jMsg">Anything else? (optional)</label>
          <textarea id="jMsg" name="message" placeholder="Why you want to come, dietary needs, questions..."></textarea>
        </div>
        <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button class="btn" type="submit" id="joinBtn">Request a spot</button>
        <div class="form-msg" id="formMsg" role="status" aria-live="polite"></div>
      </form>
    </div>
    <div class="crew-foot">
      <a class="top" href="#hero">↑ Back to the countdown</a>
    </div>
  </div>
</section>

<script>
'use strict';
/* ====== EDIT THESE ====== */
const TREK = {
  name: 'The Trek',
  start: '2026-11-17T00:00:00+05:45',  // Day 1 starts at midnight, Nepal time
  days: 400,                           // Day 400 = 21 Dec 2027
};

// Add, remove or rename people here.
const CREW = [
  { name: 'Abhinav Bista',   role: 'Trip Leader', note: 'The one who is actually invested' },
  { name: 'Anbit Bhattarai',   role: 'Instigator',   note: 'Instigated entire thing,Might ditch later' },
  { name: 'Pranil Prasai', role: 'The Son of Prasai Household',note: 'The Strongest Leg' },
  { name: 'Sakshi Sapkota',  role: 'Motivator',        note: 'Motivates us at the lowest' },
  { name: 'Srijal Joshi',  role: 'Sir Edmund Hillary',        note: 'The one who is responsible to take us' },
];
// Where join requests go. Fill in ONE (checked in this order):
const JOIN = {
  endpoint: '',   // e.g. 'https://formspree.io/f/xxxxxxx'  (sends silently, no email app needed)
  email: '',      // e.g. 'you@example.com'                  (opens the visitor's email app, pre-filled)
  whatsapp: '',   // e.g. '9779812345678' (country code, no +) (opens WhatsApp, pre-filled)
};
/* ======================== */

const DAY = 86400000;
const START = new Date(TREK.start).getTime();
const END = START + TREK.days * DAY;
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = t => new Date(t).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Asia/Kathmandu' });
const MILESTONES = [50, 100, 150, 200, 250, 300, 350, 400];
const QUOTES = [
  ['The mountains are calling and I must go.', 'John Muir'],
  ['It is not the mountain we conquer, but ourselves.', 'Edmund Hillary'],
  ['The best view comes after the hardest climb.', 'Trail saying'],
  ['Slow is smooth. Smooth is fast. Keep walking.', 'Trail saying'],
  ['A journey of a thousand miles begins with a single step.', 'Lao Tzu'],
  ['Strong legs are built on boring days.', 'Trail saying'],
  ['Small steps every day. The mountain will not move, but you will.', 'Trail saying'],
];

document.title = `400 Days to the Trek — ${TREK.name}`;
$('sub').innerHTML = `<b>${esc(TREK.name)}</b> · Day 1 on ${fmt(START)} → Day ${TREK.days} on ${fmt(END - 1)}`;
$('milestones').innerHTML = MILESTONES.map(m => `<div class="ms" data-m="${m}" style="left:${m / TREK.days * 100}%"><i></i><span>Day ${m}</span></div>`).join('');

// Crew
const PALETTE = [['#e98a3c','#f4a862'],['#5b8c66','#8fbf9a'],['#d9d4c7','#ebe7de'],['#c96f4a','#e9a07d'],['#7aa3b5','#a9cad8'],['#b59a5b','#dcc58a']];
// Each trekker gets a slightly different little peak so no two cards look the same.
const PEAKS = [
  '<path class="back" d="M0 70 L30 28 L48 52 L64 36 L104 70Z"/><path class="front" d="M14 70 L52 12 L90 70Z"/><path class="snow" d="M52 12 L41 30 L48 27 L53 33 L59 26 L63 30Z"/>',
  '<path class="back" d="M0 70 L22 40 L40 58 L104 70Z"/><path class="front" d="M26 70 L66 8 L104 70Z"/><path class="snow" d="M66 8 L54 27 L61 24 L67 31 L74 23 L78 27Z"/>',
  '<path class="back" d="M10 70 L50 34 L70 54 L104 70Z"/><path class="front" d="M0 70 L38 18 L76 70Z"/><path class="front" d="M50 70 L80 32 L104 70Z" opacity=".75"/><path class="snow" d="M38 18 L28 33 L35 31 L39 36 L45 30 L48 33Z"/>',
  '<path class="back" d="M0 70 L38 38 L60 56 L82 30 L104 70Z"/><path class="front" d="M18 70 L58 14 L98 70Z"/><path class="snow" d="M58 14 L47 31 L54 28 L59 35 L65 28 L69 32Z"/>',
];
const emblem = i => `<svg class="emblem" viewBox="0 0 104 84" aria-hidden="true"><circle class="sun" cx="86" cy="16" r="7"/>${PEAKS[i % PEAKS.length]}<path d="M0 70 H104" stroke="var(--c1)" stroke-opacity=".4" stroke-width="1.5" stroke-dasharray="3 5"/></svg>`;
$('crewCount').innerHTML = `<b>${CREW.length}</b> ${CREW.length === 1 ? 'trekker' : 'trekkers'} · ${TREK.days} days · one mountain`;
$('crewGrid').innerHTML = CREW.map((p, i) => {
  const [c1, c2] = PALETTE[i % PALETTE.length];
  const n = pad(i + 1);
  return `<article class="card" style="--c1:${c1};--c2:${c2};animation-delay:${i * 90}ms">
    <div class="bib" aria-hidden="true">${n}</div>
    <div class="tag">Trekker <b>${n}</b></div>
    ${emblem(i)}
    <h3>${esc(p.name)}</h3>
    ${p.role ? `<span class="role">${esc(p.role)}</span>` : ''}
    ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
  </article>`;
}).join('');

// Stars
let stars = '';
for (let i = 0; i < 130; i++) {
  const o = (Math.random() * .6 + .2).toFixed(2);
  stars += `<circle cx="${(Math.random() * 1440).toFixed(0)}" cy="${(Math.random() * 380).toFixed(0)}" r="${(Math.random() * 1.1 + .25).toFixed(2)}" fill="#fff" opacity="${o}"><animate attributeName="opacity" values="${o};.1;${o}" dur="${(Math.random() * 4 + 3).toFixed(1)}s" repeatCount="indefinite"/></circle>`;
}
$('stars').innerHTML = stars;

function tick() {
  const now = Date.now();
  const diff = Math.max(0, END - now);
  const completed = Math.min(TREK.days, Math.max(0, Math.floor((now - START) / DAY)));
  const pct = Math.min(100, Math.max(0, (now - START) / (END - START) * 100));

  $('d').textContent = Math.floor(diff / DAY);
  $('h').textContent = pad(Math.floor(diff / 3600000) % 24);
  $('m').textContent = pad(Math.floor(diff / 60000) % 60);
  $('s').textContent = pad(Math.floor(diff / 1000) % 60);
  $('fill').style.width = pct + '%';

  const next = MILESTONES.find(m => m > completed);
  document.querySelectorAll('.ms').forEach(el => {
    const m = +el.dataset.m;
    el.classList.toggle('done', completed >= m);
    el.classList.toggle('next', m === next);
  });

  if (now >= END) {
    document.body.classList.add('done-mode');
    $('eyebrow').textContent = 'The wait is over';
    $('bigDays').textContent = 'Trek day';
    $('status').innerHTML = '<span><b>All 400 days done.</b> Lace up — see you on the trail. 🏔️</span>';
  } else if (now < START) {
    $('status').innerHTML = `<span>Day 1 starts <b>${fmt(START)}</b></span><span><b>${TREK.days}</b> days to go</span>`;
  } else {
    $('status').innerHTML = `<span>Day <b>${completed + 1} / ${TREK.days}</b></span><span><b>${TREK.days - completed}</b> days left</span><span><b>${pct.toFixed(1)}%</b> of the wait done</span>`;
  }
}

let qi = Math.floor(Date.now() / DAY) % QUOTES.length;
function showQuote() {
  const q = $('quote'); q.style.opacity = 0;
  setTimeout(() => { const [t, w] = QUOTES[qi++ % QUOTES.length]; q.innerHTML = `“${t}”<small>— ${w}</small>`; q.style.opacity = 1; }, 500);
}

// Join form
$('joinForm').addEventListener('submit', async e => {
  e.preventDefault();
  const f = e.target, msg = $('formMsg'), btn = $('joinBtn');
  const set = (t, c) => { msg.textContent = t; msg.className = 'form-msg ' + (c || ''); };
  if (f.website.value) return; // honeypot
  const d = { name: f.name.value.trim(), contact: f.contact.value.trim(), experience: f.experience.value, fitness: f.fitness.value, message: f.message.value.trim() };
  if (!d.name || !d.contact || !d.experience || !d.fitness) { set('Please fill in the required fields.', 'err'); return; }
  const text = `Join request for ${TREK.name}\n\nName: ${d.name}\nContact: ${d.contact}\nExperience: ${d.experience}\nFitness: ${d.fitness}\nMessage: ${d.message || '-'}`;
  const done = () => { set(`Thanks ${d.name.split(' ')[0]}! We'll be in touch soon. 🥾`, 'ok'); f.reset(); };
  try {
    if (JOIN.endpoint) {
      btn.disabled = true; set('Sending...');
      const r = await fetch(JOIN.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(d) });
      if (!r.ok) throw new Error('bad response');
      done();
    } else if (JOIN.email) {
      location.href = `mailto:${JOIN.email}?subject=${encodeURIComponent('Join request: ' + d.name)}&body=${encodeURIComponent(text)}`;
      done();
    } else if (JOIN.whatsapp) {
      window.open(`https://wa.me/${JOIN.whatsapp}?text=${encodeURIComponent(text)}`, '_blank', 'noopener');
      done();
    } else {
      set('The form is not connected yet. Please contact the crew leader directly at "abhinavbista10@gmail.com".', 'err');
    }
  } catch (err) {
    set('Something went wrong. Please try again in a moment.', 'err');
  } finally { btn.disabled = false; }
});

tick(); setInterval(tick, 1000);
showQuote(); setInterval(showQuote, 20000);
</script>
